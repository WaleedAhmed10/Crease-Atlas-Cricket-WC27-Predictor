# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crease_atlas
    ports: ["5432:5432"]
    volumes: [crease_pg:/var/lib/postgresql/data]
volumes:
  crease_pg:
